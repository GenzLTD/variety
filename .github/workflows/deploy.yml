name: Deploy portal (szbolent.com)

# 橱窗发到新机，按域名 szbolent.com / www.szbolent.com 接入。
# 不抢 80 的 default_server（那是 looma 宿主）。不装 443：备案证书尚未签发。
#
# 禁止：
#   - 阿里云 47.115.168.107（szbolent.cn 书店）
#   - 旧腾讯云 1.14.202.161（szbolent.com.cn 橱窗，已退役）
# 主机、用户、密钥、指纹走 GitHub variables/secrets，仓库里不写裸 IP。
#
# 旧的 contracts/entry.json → nginx.conf 仍是书店机那份生成物。
# 本工作流不安装它。新机站点是 deploy/nginx/szbolent.com.conf。
#
# dry_run：手动触发默认 true，只构建，不 SSH。push tag v* 恒为真发布。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只构建 + 构建期验收，不上传不切换（默认 true）'
        type: boolean
        default: true

concurrency:
  group: deploy-szbolent-com
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve dry-run
        id: dry
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "flag=true" >> "$GITHUB_OUTPUT"
            echo "::notice::dry_run=true —— 本轮只构建，不上传不切换"
          else
            echo "flag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Contract sync gate (gen-entry --check)
        run: node scripts/gen-entry.mjs --check

      - name: Menu seed sync gate (gen-menus --check)
        run: npm run menus:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build portal
        run: npm run build

      - name: Verify build output
        run: |
          set -euo pipefail
          test -s dist/index.html || { echo "::error::dist/index.html 不存在或为空"; exit 1; }
          grep -q 'id="app"' dist/index.html || { echo "::error::dist/index.html 里没有 Vue 挂载点"; exit 1; }
          ls dist/assets/*.js >/dev/null 2>&1 || { echo "::error::dist/assets 下没有 js 产物"; exit 1; }

      - name: Verify GEO P0 (domain + llms + JSON-LD + og-image)
        run: node scripts/verify-geo-p0.mjs

      - name: Verify GEO P1 (core prerender shells)
        run: node scripts/verify-geo-p1.mjs

      - name: Verify GEO P2 (dynamic sitemap + Service/FAQ/Breadcrumb)
        run: node scripts/verify-geo-p2.mjs

      - name: Verify baked menu in build output
        run: npm run test:unit

      - name: Dry run summary
        if: steps.dry.outputs.flag == 'true'
        run: echo "::notice::dry_run 结束。确认要发布请再跑一次并把 dry_run 设为 false，或推送 v* 标签"

      - name: Publish szbolent.com on the new machine
        if: steps.dry.outputs.flag != 'true'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
        run: ./scripts/ci-deploy-portal.sh
