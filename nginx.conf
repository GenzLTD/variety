# ============================================================
# ⚠️  本文件由 scripts/gen-entry.mjs 从 contracts/entry.json 生成，请勿手改。
#     修改分流规则：改 contracts/entry.json → node scripts/gen-entry.mjs
#
#     门户入口 — 阿里云 47.115.168.107
#     契约版本: v2
# ============================================================


# ── :80 —— 只做两件事：放行 ACME 校验、其余全部 301 到 HTTPS ──
server {
    listen 80 default_server;
    listen [::]:80;
    server_name _ 47.115.168.107 szbolent.cn www.szbolent.cn szbolent.com.cn www.szbolent.com.cn bolent.cn www.bolent.cn;

    client_max_body_size 64m;
    charset utf-8;

    # Let's Encrypt HTTP-01 校验通道 —— certbot 续期依赖它，勿删。
    # 域名: szbolent.cn www.szbolent.cn    webroot: /var/www/certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    # ACME 通道已在上方放行；其余请求一律升级到 HTTPS。
    # 注意用 $host 而非固定域名：这样 www / 裸域各自升级后仍落在同一张证书的 SAN 内。
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── :443 —— 门户正式入口。证书由 certbot 签发/续期，本文件只引用路径 ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name szbolent.cn www.szbolent.cn;

    ssl_certificate     /etc/letsencrypt/live/szbolent.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/szbolent.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 64m;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # ── 默认位置：门户 SPA 与 WP 内容站的切换点（见 contracts/README.md）──
    location / {
        root /var/www/szbolent-portal/dist;
        try_files $uri $uri/ /index.html;
    }

    # 诗词 / RAG / 认证 / 支付（兜底，须最后声明） → looma
    location /v1 {
        proxy_pass http://api.genz.ltd;
        proxy_set_header Host api.genz.ltd;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 10s;
    }

    # 博客 REST 通道（门户 Blog / 书架数据源） → wordpress
    location /wp-json {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 10s;
    }

    # WP 后台。门户接管 /（static）后 location / 不再回源 WP，后台只能靠这条活着，删了就登不进去 → wordpress
    location /wp-admin {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 10s;
    }

    # WP 登录入口。与 /wp-admin 同因：不加则后台登录页 404 → wordpress
    location /wp-login.php {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 10s;
    }

    # WP 上传媒体。博客正文 HTML 里的图片指向这里，不加则文章配图全碎 → wordpress
    location /wp-content {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 10s;
    }
}
