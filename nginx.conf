# ============================================================
# ⚠️  本文件由 scripts/gen-entry.mjs 从 contracts/entry.json 生成，请勿手改。
#     修改分流规则：改 contracts/entry.json → node scripts/gen-entry.mjs
#
#     门户入口 — 生产（szbolent.com / www.szbolent.com；主机地址由 CI repo 变量 vars.DEPLOY_HOST 决定，不在契约里写死）
#     契约版本: v2
# ============================================================


# ── :80（两块）—— 证书覆盖域名升级到自身 HTTPS；
#               未持证域名（szbolent.cn / www.szbolent.cn / bolent.cn / www.bolent.cn）与兜底 host 一律 301 到规范主机 www.szbolent.com，
#               绝不送进无证书的 https://$host。──
server {
    listen 80;
    listen [::]:80;
    server_name szbolent.com www.szbolent.com;

    client_max_body_size 64m;
    charset utf-8;

    # 证书覆盖的域名：升级到自身 HTTPS（$host 落在证书 SAN 内）。
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80 default_server;
    listen [::]:80;
    server_name _ szbolent.cn www.szbolent.cn bolent.cn www.bolent.cn;

    client_max_body_size 64m;
    charset utf-8;

    # 未持证域名（不在 tls.serverNames 内）与兜底 host：301 到规范主机。
    # 绝不能用 https://$host —— 那会把未持证域名送进无证书的 443（cert 错误）。
    location / {
        return 301 https://www.szbolent.com$request_uri;
    }
}

# ── :443 —— 门户正式入口。证书由 acme.sh DNS-01 签发/续期，本文件只引用路径 ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name szbolent.com www.szbolent.com;

    ssl_certificate     /etc/nginx/ssl/szbolent.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/szbolent.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 64m;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # ── 默认位置：门户 SPA 与 WP 内容站的切换点（见 contracts/README.md）──
    location / {
        root /var/www/szbolent-portal/dist;
        try_files $uri $uri/ /index.html;
    }

    # 诗词 / RAG / 认证 / 支付（本机 Looma，同源无跨域；v0.4.0 由 looma 外跳 api.genz.ltd 切换而来） → looma-local
    location /v1 {
        proxy_pass http://127.0.0.1:5200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 10s;
    }

    # 博客 REST 通道（门户 Blog / 书架数据源） → wordpress
    location /wp-json {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 10s;
    }

    # WP 后台。门户接管 /（static）后 location / 不再回源 WP，后台只能靠这条活着，删了就登不进去 → wordpress
    location /wp-admin {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 10s;
    }

    # WP 登录入口。与 /wp-admin 同因：不加则后台登录页 404 → wordpress
    location /wp-login.php {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 10s;
    }

    # WP 上传媒体。博客正文 HTML 里的图片指向这里，不加则文章配图全碎 → wordpress
    location /wp-content {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 10s;
    }
}
