# szbolent.com 门户。只按域名接入，不是 default_server。
# 本机 80 的 default_server 仍是 looma：IP 直连继续进宿主。
# 备案证书还没落到 /etc/letsencrypt/live/szbolent.com/，这里不写 443。
# 证书就绪后再加 TLS，并让 :80 除 ACME 外 301。在那之前写 ssl_certificate 会让 nginx -t 失败。
server {
    listen 80;
    listen [::]:80;
    server_name szbolent.com www.szbolent.com;

    client_max_body_size 20m;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    # 门户 /v1 仍去海外 api.genz.ltd。不把这个域名改指到本机。
    location /v1 {
        proxy_pass https://api.genz.ltd;
        proxy_ssl_server_name on;
        proxy_set_header Host api.genz.ltd;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 10s;
    }

    location / {
        root /var/www/szbolent.com/dist;
        try_files $uri $uri/ /index.html;
    }
}
