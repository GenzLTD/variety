# szbolent.com 门户。只按域名接入，不是 default_server。
# 本机 80 的 default_server 仍是 looma：IP 直连继续进宿主。
# 备案证书还没落到 /etc/letsencrypt/live/szbolent.com/，这里不写 443。
# 证书就绪后再加 TLS，并让 :80 除 ACME 外 301。在那之前写 ssl_certificate 会让 nginx -t 失败。
server {
    listen 80;
    listen [::]:80;
    server_name szbolent.com www.szbolent.com;

    client_max_body_size 20m;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    # /v1 只进本机 looma（127.0.0.1:5200）。浏览器仍请求 szbolent.com，不跨域，不转到 api.genz.ltd。
    location /v1 {
        proxy_pass http://127.0.0.1:5200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 10s;
    }

    # 书店在法兰克福。浏览器只打本机的 /wp-json 与 /wp-content。
    # 阿里云书店和旧腾讯云不在这条站点里。
    location /wp-json/ {
        proxy_pass http://45.76.84.90;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 10s;
    }

    location /wp-content/ {
        proxy_pass http://45.76.84.90;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 10s;
    }

    location / {
        root /var/www/szbolent.com/dist;
        try_files $uri $uri/ /index.html;
    }
}
